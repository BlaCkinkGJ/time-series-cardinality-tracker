apiVersion: v1
kind: Service
metadata:
  name: cardinality-lb
  namespace: cardinality
  labels:
    app: cardinality
spec:
  # Round-robin hits any node; each node uses consistent-hash routing
  # to forward gRPC requests to the correct shard owner internally.
  type: LoadBalancer
  selector:
    app: cardinality
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP
