syntax = "proto3";

package cardinality.v1;
option go_package = "github.com/yourorg/cardinality-tracker/gen/cardinality/v1;cardinalityv1";

import "google/api/annotations.proto";

service CardinalityService {
  // Add inserts an ID into the HLL for a given group.
  rpc Add(AddRequest) returns (AddResponse) {
    option (google.api.http) = {
      post: "/v1/group/{group}/add"
      body: "*"
    };
  }

  // BatchAdd inserts multiple IDs in one call.
  rpc BatchAdd(BatchAddRequest) returns (AddResponse) {
    option (google.api.http) = {
      post: "/v1/group/{group}/batch"
      body: "*"
    };
  }

  // Query returns the current cardinality estimate.
  rpc Query(QueryRequest) returns (QueryResponse) {
    option (google.api.http) = {
      get: "/v1/group/{group}/cardinality"
    };
  }
}

message AddRequest {
  string group = 1;
  string id    = 2;
}

message BatchAddRequest {
  string          group = 1;
  repeated string ids   = 2;
}

message AddResponse {
  bool ok = 1;
}

message QueryRequest {
  string group    = 1;
  bool   stale_ok = 2;
}

message QueryResponse {
  string group       = 1;
  uint64 cardinality = 2;
}
