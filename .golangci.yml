version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: standard
  enable:
    # Code quality / correctness
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - gosec
    - revive
    - misspell
    # Style & cleanliness
    - goconst
    - unparam
    - unconvert
    - nakedret
    - prealloc
    - whitespace
    - gocritic
    - nilerr
    - errorlint
    - forcetypeassert
    - makezero
  disable:
    - depguard
  settings:
    revive:
      rules:
        - name: exported
          disabled: true  # generated protobuf code triggers this
        - name: package-comments
          disabled: true  # package-comments is ignored since we have no package docs
        - name: unused-parameter
          disabled: true  # sometimes we have unimplemented interfaces
    gosec:
      excludes:
        - G104
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - unnamedResult
  exclusions:
    paths:
      - "gen/.*"
    rules:
      # grpc.Dial is deprecated but generated gateway code still uses it
      - linters: [staticcheck]
        text: "SA1019"
      # Integer overflow conversion in generated/test code
      - linters: [gosec]
        text: "G115"
      # Fire-and-forget gs.Serve in tests is intentional
      - linters: [errcheck]
        path: "(.+)_test\\.go"
        text: "gs\\.Serve"
      # Ignore errcheck, gosec, forcetypeassert, and unparam in test files
      - path: "(.+)_test\\.go"
        linters:
          - errcheck
          - gosec
          - forcetypeassert
          - unparam
      # Exclude net.Listen warnings from noctx
      - linters: [noctx]
        text: "net.Listen must not be called"
      # Ignore goconst for common short strings
      - linters: [goconst]
        text: 'string `(error|method)`'
