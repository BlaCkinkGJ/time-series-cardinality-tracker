version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - misspell
    - revive
    - gosec
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
  disable:
    - depguard

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true  # generated protobuf code triggers this

issues:
  # Exclude generated protobuf / gateway code from all linting
  exclude-dirs:
    - gen
  exclude-rules:
    # grpc.Dial is deprecated but generated gateway code still uses it
    - linters: [staticcheck]
      text: "SA1019"
    # Integer overflow conversion in generated code
    - linters: [gosec]
      text: "G115"
    # Fire-and-forget gs.Serve in tests is intentional
    - linters: [errcheck]
      path: "_test\\.go"
      text: "gs\\.Serve"
