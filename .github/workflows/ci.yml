name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.3'

      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.3'

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Run go-licenses check
        run: $(go env GOPATH)/bin/go-licenses check ./cmd/server

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.3'

      - name: Run Unit Tests
        run: go test -v ./internal/... -count=1

      - name: Run Integration Tests
        run: go test -v ./internal/... -tags=integration -timeout=120s -count=1

  smoke-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.3'

      - name: Build Docker Images
        run: |
          cd deploy
          docker compose build

      - name: Run Smoke Test Script
        run: ./scripts/smoke-test.sh
