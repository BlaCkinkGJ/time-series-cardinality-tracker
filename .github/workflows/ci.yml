name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21.3'

      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21.3'

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Run go-licenses check
        run: $(go env GOPATH)/bin/go-licenses check ./cmd/server

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21.3'

      - name: Run Unit Tests
        run: go test -v ./internal/... -count=1

      - name: Run Integration Tests
        run: go test -v ./internal/... -tags=integration -timeout=120s -count=1

  smoke-test:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21.3'

      - name: Build Docker Images
        run: |
          cd deploy/docker
          docker compose build

      - name: Run Smoke Test Script
        run: ./scripts/smoke-test.sh

  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Kubeconform
        uses: bmuschko/setup-kubeconform@v1

      - name: Validate Manifests
        run: kubeconform -summary -verbose -ignore-missing-resources ./deploy/kubernetes/

  validate-docker:
    name: Validate Docker Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: deploy/docker/Dockerfile

      - name: Validate Docker Compose
        run: |
          cd deploy/docker
          docker compose config
